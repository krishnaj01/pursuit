<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pursuit | Track job applications, stages and follow-up reminders." />
    <title>Pursuit | Job application tracker</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const pref = JSON.parse(localStorage.getItem('pursuit-theme') || '{}').state?.preference || 'system'
        const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
